services:
  nginx:
    image: nginx:alpine
    container_name: sitesentinel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - sitesentinel-network

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sitesentinel-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - app-storage:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sitesentinel-network

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sitesentinel-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sitesentinel-network

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sitesentinel-worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=monitoring,notifications,maintenance,default", "--sleep=3", "--tries=3"]
    volumes:
      - ./:/var/www/html
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sitesentinel-network

  mysql:
    image: mysql:8.0
    container_name: sitesentinel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-sitesentinel}
      MYSQL_USER: ${DB_USERNAME:-sitesentinel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - sitesentinel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sitesentinel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - sitesentinel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sitesentinel-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  app-storage:
