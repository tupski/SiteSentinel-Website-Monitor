name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Coding Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_mysql, pdo_sqlite, sqlite3, bcmath, pcntl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo, pdo_mysql, pdo_sqlite, sqlite3, bcmath, pcntl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          # CI has no MySQL/Redis services; run tests on SQLite + database queue + file cache.
          # Canonical production stack (MySQL 8 + Redis) is unchanged.
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/^QUEUE_CONNECTION=redis/QUEUE_CONNECTION=database/' .env
          sed -i 's/^CACHE_STORE=redis/CACHE_STORE=file/' .env
          php artisan key:generate --force

      - name: Run migrations (SQLite)
        run: php artisan migrate:fresh --force

      - name: Run test suite
        run: php artisan test

  assets:
    name: Asset Build (Tailwind + Turbo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
