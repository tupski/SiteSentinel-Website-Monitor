upstream php-fpm {
    server app:9000;
}

server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};
    root /var/www/html/public;

    # Static security headers. HSTS + CSP belong at the TLS terminator in front
    # of this container (deployment task — see RUNBOOK hand-off notes), because
    # HSTS must only ever be sent over HTTPS.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    index index.php;
    charset utf-8;
    client_max_body_size 8m;

    # Do not advertise the Nginx version.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Guard against the classic Nginx PHP path-info / upload-progress weakness.
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Trust the client address from the upstream terminator only.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Never serve dotfiles (except ACME challenges).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
