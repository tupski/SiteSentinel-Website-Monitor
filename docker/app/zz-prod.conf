; SiteSentinel production php-fpm pool override.
; Copied into /usr/local/etc/php-fpm.d/zz-prod.conf at build time.
; Global directives must come before any pool; php-fpm's default www.conf is
; already loaded, so this file only overrides the pool's security/health settings.

[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
; Run the worker pool as an unprivileged user (SECURITY.md §11).
user = www-data
group = www-data
listen = 0.0.0.0:9000

; Container healthcheck target: `cgi-fcgi -bind -connect 127.0.0.1:9000?/ping`.
; Responds only with the literal string `pong`; never exposes app config/secrets.
ping.path = /ping
ping.response = pong

; Drain in-flight requests on SIGTERM instead of dropping them (graceful restart).
process_control_timeout = 20s

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

; Never expose PHP version in responses/headers.
expose_php = off
